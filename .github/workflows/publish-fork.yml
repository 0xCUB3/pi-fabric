name: Publish fork

# Publishes the fork to npm as @e4779/pi-fabric so pi can install a
# prebuilt tarball (npm:@e4779/pi-fabric) instead of a git clone that
# would need a manual build after every update. The publish step stays
# skipped (run stays green) until the NPM_TOKEN repo secret is set.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Set fork version (base-fork.<run_number>)
        run: |
          BASE=$(node -p "require('./package.json').version")
          npm version "${BASE}-fork.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - name: Publish (prepack runs typecheck + build)
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm publish --access public
