name: Publish fork

# Publishes the fork to npm as @e4779/pi-fabric so pi can install a
# prebuilt tarball (npm:@e4779/pi-fabric) instead of a git clone that
# would need a manual build after every update. The unscoped name
# "pi-fabric" belongs to upstream and cannot be published to.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Set fork identity (@e4779/pi-fabric, version base-fork.<run_number>)
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.name = '@e4779/pi-fabric';
            p.version = p.version + '-fork.${{ github.run_number }}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
          "
      - name: Publish (prepack runs typecheck + build)
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm publish --access public
